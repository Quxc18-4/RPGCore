name: RPGCore
version: '1.0-SNAPSHOT'
main: vn.minecraft.rPGCore.RPGCore
api-version: '1.21'
authors: [Quốc Danh Minh]

commands:
  class:
    description: Mở menu chọn lớp nhân vật
  profile:
    description: Xem thông tin chi tiết nhân vật và trang bị.
    aliases: [ tt, info ]
  rpgadmin:
    description: Lệnh quản trị hệ thống RPG
    permission: rpgcore.admin
    usage: /rpgadmin <giveexp|levelup|antiheal>> <player> [amount/ticks]
  attr:
    description: Mở menu nâng cấp chỉ số nhân vật (STR, INT, VIT...)
    aliases: [ stats, chiso ]
  skill:
    description: Mở menu kỹ năng của class
  binds:
    description: Mở menu gán nút cho kỹ năng
  rpgclassadmin:
    description: Lệnh quản lý class cho Admin
    permission: rpgcore.admin
  arrow:
    description: Lấy danh sách các mũi tên custom
    permission: rpgcore.admin
  eq:
    description: Sinh trang bị RPG ngẫu nhiên (Dành cho Admin)
    usage: /<command> roll <weapon|armor|trinket> <tier(1-8)> <level> [lineage] [extra_stats]
    permission: rpgcore.admin
    permission-message: §cBạn không đủ quyền hạn để tạo trang bị!
  repairadmin:
    description: Lấy bộ dụng cụ sửa chữa và Đá mài
    permission: rpgcore.admin
    usage: /repairadmin <kit|stone> [loại/số_lần] [số_lượng]
  ig:
    description: Lệnh lấy đồ ăn RPG
    permission: rpgcore.admin
  bal:
    description: "Quan ly tien te va tai khoan Ngan hang."
    usage: "/bal [top|add|coin|tên_người_chơi]"
    aliases: [ balance, money, economy ]
  spawnnpc:
    description: "Trieu hoi NPC Thuong Nhan / Ngan Hang."
    usage: "/spawnnpc <bank|weapon|food|general>"
  dummy:
    description: Triệu hồi bù nhìn thử nghiệm sát thương.
    usage: /dummy
    permission: rpgcore.admin
  job:
    description: Mo menu lua chon Nghe Nghiep
    usage: /job
  h:
    description: "Quan ly he thong thu cuoi cua ban"
    usage: "/h [1/2/3/gui/admin]"
  trinket:
    description: Mo giao dien Trang Suc
    aliases: [ t, trinket ]
  login:
    description: Đăng nhập vào máy chủ
    usage: /login <mật khẩu>
  register:
    description: Đăng ký tài khoản mới
    usage: /register <mật khẩu> <email@haha.com>
  forgotpw:
    description: Khôi phục mật khẩu tự động
    usage: /forgotpw <email@haha.com>
  kit:
    description: Nhận Gói Quà
  adminkit:
    description: Quản lý phần quà Admin
    permission: rpgcore.admin
    permission-message: §cBan không có quyền sử dụng lệnh này!
  diemdanh:
    description: Mở bảng điểm danh nhận quà hàng ngày
  ah:
    description: "Mở giao diện Chợ hoặc Bán nhanh"
    usage: "/ah hoặc /ah <giá>"
  ahc:
    description: "Đăng bán vật phẩm có xác nhận"
    usage: "/ahc <giá>"
  trade:
    description: Lệnh giao dịch an toàn giữa người chơi.
    usage: /trade <tên> | accept | deny
  friend:
    description: "Hệ thống bạn bè"
    usage: "/friend <add/accept/remove/list> [tên]"
    aliases: [ banbe, f ]
  arena:
    description: "Quản lý hệ thống bản đồ Đấu Trường (Dành cho Admin)"
    usage: "/arena <create/delete/setspawn1/setspawn2> <tên map>"
    permission: rpgcore.admin.arena
  duel:
    description: "Thách đấu người chơi khác một cách an toàn"
    usage: "/duel <tên> | accept"
  shop:
    description: "Mở cửa hàng hệ thống"
    aliases: [ "store" ]