plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'vn.minecraft'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = uri("https://mvn.lumine.io/repository/maven-public/")
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly 'io.lumine:Mythic-Dist:5.11.2'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// Tạo một task mới để copy file
tasks.register('copyToOtherProjects') {
    // Đảm bảo task này chỉ chạy SAU KHI task 'build' (hoặc 'jar') đã hoàn thành
    dependsOn('build')

    doLast {
        // Lấy đường dẫn tới file JAR vừa được build ra
        // Nếu bạn dùng shadowJar (đóng gói thư viện) thì đổi 'jar' thành 'shadowJar'
        def sourceJar = jar.archiveFile.get().asFile

        // 1. Copy sang RPGDens
        copy {
            from sourceJar
            into "C:/Users/Pon/IdeaProjects/RPGDens/libs"
        }

        // 2. Copy sang RPGGuild
        copy {
            from sourceJar
            into "C:/Users/Pon/IdeaProjects/RPGGuild/libs"
        }

        // 3. Copy sang RPGParty
        copy {
            from sourceJar
            into "C:/Users/Pon/IdeaProjects/RPGParty/libs"
        }

        println "[RPGCore] Đã copy tự động file JAR sang các project vệ tinh!"
    }
}

// Lệnh này giúp Gradle tự động nối task copy vào sau mỗi lần bạn chạy lệnh 'build'
build.finalizedBy(copyToOtherProjects)

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}