plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    // Thêm Shadow plugin để hỗ trợ build các thư viện 'implementation'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'vn.minecraft'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = uri("https://mvn.lumine.io/repository/maven-public/")
    }
    // 1. Repo của FAWE
    maven { url = 'https://repo.intellectualsites.com/content/groups/public/' }
    // 2. Thêm Repo của WorldEdit (EngineHub)
    maven { url = 'https://maven.enginehub.org/repo/' }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly 'io.lumine:Mythic-Dist:5.11.2'
    // Khai báo bộ API gốc của WorldEdit để IDE hết báo lỗi đỏ
    compileOnly 'com.sk89q.worldedit:worldedit-core:7.3.0'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:7.3.0'

    // Khai báo FAWE
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Core:2.11.2'
    compileOnly 'com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit:2.11.2'

    // --- [MỚI] THƯ VIỆN MONGODB & BẢO MẬT ---
    // Dùng 'implementation' để Gradle gói kèm vào file build cuối cùng
    implementation 'org.mongodb:mongodb-driver-sync:4.11.1'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'com.sun.mail:javax.mail:1.6.2'
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// ========================================================
// SỬA Ở ĐÂY: COPY FILE TỪ SHADOW JAR THAY VÌ JAR THƯỜNG
// ========================================================
tasks.register('copyToOtherProjects') {
    // Đảm bảo task này chỉ chạy SAU KHI task 'shadowJar' đã hoàn thành
    dependsOn('shadowJar')

    doLast {
        // [QUAN TRỌNG]: Lấy đường dẫn tới file SHADOW JAR (có chứa MongoDB)
        def sourceJar = shadowJar.archiveFile.get().asFile

        // 1. Copy sang RPGDens
        copy {
            from sourceJar
            into "C:/Users/Pon/IdeaProjects/RPGDens/libs"
        }

        // 2. Copy sang RPGGuild
        copy {
            from sourceJar
            into "C:/Users/Pon/IdeaProjects/RPGGuild/libs"
        }

        // 3. Copy sang RPGParty
        copy {
            from sourceJar
            into "C:/Users/Pon/IdeaProjects/RPGParty/libs"
        }

        println "[RPGCore] Đã copy tự động file SHADOW JAR sang các project vệ tinh!"
    }
}

// Đảm bảo khi bạn bấm chạy 'build', nó sẽ tự động chạy 'shadowJar' và sau đó kích hoạt task copy
build.dependsOn(shadowJar)
shadowJar.finalizedBy(copyToOtherProjects)

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}